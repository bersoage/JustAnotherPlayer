name: Build beta APK

on:
  push:
    branches: [main, master, justanotherplayer]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build APK
        env:
          BETA_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleLatestUniversalDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/latestUniversal/debug/*.apk out/JustAnotherPlayer-beta${{ github.run_number }}.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: JustAnotherPlayer-beta${{ github.run_number }}
          path: out/JustAnotherPlayer-beta${{ github.run_number }}.apk

      - name: Publish to the "beta" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view beta >/dev/null 2>&1 || gh release create beta --prerelease --title "JustAnotherPlayer beta" --notes "Latest beta build. Download the .apk below and install it on the TV."
          for a in $(gh release view beta --json assets --jq '.assets[].name'); do
            gh release delete-asset beta "$a" -y
          done
          gh release upload beta out/JustAnotherPlayer-beta${{ github.run_number }}.apk

      - name: Move the "beta" tag to this commit
        run: |
          git tag -f beta
          git push -f origin beta
